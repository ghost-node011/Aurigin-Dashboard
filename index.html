<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurigin People — HR Portal</title>
    <meta name="description" content="Aurigin Media's internal HR portal — attendance, leave, onboarding, recognition, and more." />
    <script>
      (function () {
        var stored = localStorage.getItem("aurigin-hr.theme");
        var theme = stored ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
